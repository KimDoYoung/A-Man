# t3600 - 개발 PC, docker gxt-demo 컨테이너 (기존 deploy-t3600.sh)
#   gxt-demo는 WAR를 개별 파일로 마운트한다 → /data/docker/docker-compose.yml
HOST_LABEL="t3600 개발 (docker gxt-demo)"
DEPLOY_TYPE="local-docker"
PROFILE="t3600"
PRODUCTION=false
ALLOWED_WARS="aman aman20"

EXPECTED_HOSTNAME="T3600"
CONTAINER="gxt-demo"
WEBAPPS_DIR="/data/docker/gxt-demo/webapps"
COMPOSE_FILE="/data/docker/docker-compose.yml"
COMPOSE_MOUNT_CHECK=true
PREPARE_DIRS=true
ACCESS_URL="http://localhost:8081"
SETENV_FILE="/data/docker/gxt-demo/bin/setenv.sh"
SETENV_PATTERN="spring\.profiles\.active=t3600"
