# omen - docker aman-tomcat 컨테이너 (기존 deploy-omen.sh)
#   aman-tomcat 볼륨: /data/docker/aman/webapps → /usr/local/tomcat/webapps (폴더 전체 마운트)
#   컨테이너 환경: AMAN_MODE=omen → application-omen.properties
HOST_LABEL="omen (docker aman-tomcat)"
DEPLOY_TYPE="local-docker"
PROFILE="omen"
PRODUCTION=false
ALLOWED_WARS="aman aman20"

EXPECTED_HOSTNAME="omen"
CONTAINER="aman-tomcat"
WEBAPPS_DIR="/data/docker/aman/webapps"
COMPOSE_MOUNT_CHECK=false
PREPARE_DIRS=false
ACCESS_URL="http://omen:8686"
