# dell6820 - docker gxt-demo 컨테이너 (기존 deploy-dell6820.sh)
#   t3600과 같은 구성: WAR 개별 파일 마운트, base-dir /data/asseterp/aman
#   컨테이너 환경: setenv.sh 에 export AMAN_MODE=dell6820 → application-dell6820.properties
#   ※ 기존 --init-db(DB 초기화)는 옮기지 않음 → db.sh runfile 사용 (./deploy.sh --help 참조)
HOST_LABEL="dell6820 (docker gxt-demo)"
DEPLOY_TYPE="local-docker"
PROFILE="dell6820"
PRODUCTION=false
ALLOWED_WARS="aman aman20"

EXPECTED_HOSTNAME="dell6820"    # 실제 호스트명과 다르면 수정 (hostname 명령으로 확인)
CONTAINER="gxt-demo"
WEBAPPS_DIR="/data/docker/gxt-demo/webapps"
COMPOSE_FILE="/data/docker/docker-compose.yml"
COMPOSE_MOUNT_CHECK=true
PREPARE_DIRS=true
ACCESS_URL="http://localhost:8081"
SETENV_FILE="/data/docker/gxt-demo/bin/setenv.sh"
SETENV_PATTERN="^[[:space:]]*export[[:space:]]+AMAN_MODE=\"?dell6820\"?"
