# jskn - 원격 docker, 이미지 재빌드 방식 (기존 deploy-jskn.sh)
#   WAR와 Dockerfile을 업로드한 뒤 원격에서 docker compose up -d --build 로 이미지를 다시 만든다.
#   nginx가 /aman/ 을 jskn_aman 컨테이너로 프록시 (docs/보존/배포.md)
#   Dockerfile 이 aman.war 이름으로 고정되어 있어 aman 만 허용
#   ※ 기존 --init-db(원격 DB 초기화)는 옮기지 않음
HOST_LABEL="jskn (원격 docker, 이미지 재빌드)"
DEPLOY_TYPE="remote-docker"
PROFILE="jskn"
PRODUCTION=false
ALLOWED_WARS="aman"

REMOTE="jskn"                               # ssh 별칭 (~/.ssh/config)
REMOTE_DATA="/data/docker/apps/aman/data"   # WAR, Dockerfile 업로드 위치 (docker build context)
REMOTE_COMPOSE_DIR="/data/docker"
COMPOSE_SERVICE="aman"
DOCKERFILE="Dockerfile"                     # 프로젝트 루트 기준
ACCESS_URL="http://jskn.iptime.org"
